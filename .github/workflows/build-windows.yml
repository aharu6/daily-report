name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  UV_PYTHON: "3.11"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build exe (flet pack)
        working-directory: src
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          $plotly = uv run python -c "import plotly, os; print(os.path.dirname(plotly.__file__))"
          uv run flet pack main.py -i appicon\diary-left-svgrepo-com.ico --file-version 1.70.8.${{ github.run_number }} -n 業務見える化日誌 --add-data "$plotly;plotly" --add-data "$plotly\package_data;plotly/package_data"
      - name: Write SHA-256 hash
        shell: pwsh
        run: |
          $exe = Get-Item src/dist/*.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  $($exe.Name)" | Out-File -FilePath src/dist/SHA256.txt -Encoding ascii
          "## SHA-256" >> $env:GITHUB_STEP_SUMMARY
          "$($exe.Name): $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-exe
          path: src/dist/*.exe